<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backfill review</title>
<style>
:root {
  --bg: #f5f5f7; --panel: #ffffff; --ink: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
  --accent: #5b4bdb; --accent-ink: #ffffff; --accent-soft: #ecebfb;
  --ok: #1f8a4c; --ok-soft: #e4f4ea; --warn: #b25e00; --warn-soft: #fbefdf;
  --bad: #c0362c; --bad-soft: #fbe6e4; --code: #f0f0f3;
  --r: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111114; --panel: #1c1c21; --ink: #f2f2f5; --muted: #9a9aa3; --line: #2e2e36;
    --accent: #8f83ff; --accent-ink: #111114; --accent-soft: #2a2747;
    --ok: #4cc283; --ok-soft: #173325; --warn: #f0a24a; --warn-soft: #3a2a14;
    --bad: #ff7b70; --bad-soft: #3d1e1b; --code: #26262d;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 13px; white-space: nowrap; }
.progress { flex: 1; min-width: 80px; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--ok); transition: width .25s; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
main { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; padding: 20px; max-width: 1280px; margin: 0 auto; }
nav { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px;
  align-self: start; position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
nav button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; background: none; padding: 8px 10px; border-radius: 8px; }
nav button:hover { background: var(--bg); }
nav button.cur { background: var(--accent-soft); }
nav .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); }
nav .dot.done { background: var(--ok); border-color: var(--ok); }
nav .dot.reject { background: var(--bad); border-color: var(--bad); }
nav button > span:last-child { min-width: 0; }
nav .id { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
nav .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; }
.meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.badge { padding: 2px 8px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 600; font-size: 12px; }
h2 { margin: 6px 0 18px; font-size: 22px; line-height: 1.3; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
.side { border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.side .lbl { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.side p { margin: 6px 0 8px; }
code, .ev { font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: var(--code);
  border-radius: 6px; padding: 2px 6px; word-break: break-word; }
.ev { display: inline-block; color: var(--muted); }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--ok); background: var(--ok-soft); }
.key { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
  background: var(--code); font-size: 12px; font-weight: 700; }
.rec { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; color: var(--accent); }
.why { margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
.affects { color: var(--muted); font-size: 13px; margin-top: 10px; }
.custom { margin-top: 16px; display: none; }
.custom.show { display: block; }
textarea { width: 100%; min-height: 80px; font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.state { margin-left: auto; font-size: 13px; color: var(--muted); }
.state.saved { color: var(--ok); }
footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 4px 20px 24px; }
footer kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px; background: var(--panel); }
.empty { text-align: center; padding: 60px 20px; }
.empty h2 { margin-top: 0; }
@media (max-width: 820px) {
  main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  header > div:first-child { flex: 1 1 100%; min-width: 0; }
  header .sub { white-space: normal; }
  nav { position: static; max-height: 180px; }
  header { flex-wrap: wrap; padding: 12px 16px; }
  .progress { order: 9; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>
<body>
<header>
  <div><h1 id="repo">Backfill review</h1><div class="sub" id="sub"></div></div>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <span class="sub" id="count" aria-live="polite"></span>
  <button class="btn" id="acceptAll" title="Take the recommendation for every open item">Accept all recommendations</button>
  <button class="btn primary" id="done">Done</button>
</header>
<main>
  <nav id="list" aria-label="Clashes"></nav>
  <section id="view" aria-live="polite"></section>
</main>
<footer>
  <kbd>1</kbd>–<kbd>9</kbd> choose · <kbd>R</kbd> recommendation · <kbd>E</kbd> own answer ·
  <kbd>X</kbd> reject finding · <kbd>U</kbd> undo · <kbd>←</kbd><kbd>→</kbd> or <kbd>J</kbd><kbd>K</kbd> move · <kbd>S</kbd> skip
</footer>
<script>
(() => {
  const T = new URLSearchParams(location.search).get('t');
  const api = (p, body) => fetch(p + '?t=' + encodeURIComponent(T), body ? {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  } : undefined).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);
  let data = null, cur = 0, finished = false;

  const items = () => data.items;
  const ans = id => data.answers[id];
  const open = () => items().filter(i => !ans(i.id));

  function label(a, it) {
    if (!a) return '';
    if (a.choice === 'reject') return 'Rejected';
    if (a.choice === 'custom') return 'Own answer';
    return 'Option ' + (a.choice + 1) + (a.choice === it.recommendation ? ' (recommended)' : '');
  }

  function renderList() {
    $('list').innerHTML = items().map((it, i) => {
      const a = ans(it.id);
      const cls = a ? (a.choice === 'reject' ? 'reject' : 'done') : '';
      return `<button data-i="${i}" class="${i === cur ? 'cur' : ''}" aria-current="${i === cur}">
        <span class="dot ${cls}"></span><span><div class="id">${esc(it.id)}</div><div class="t">${esc(it.title)}</div></span></button>`;
    }).join('');
    const n = items().length, d = n - open().length;
    $('bar').style.width = (n ? d / n * 100 : 100) + '%';
    $('count').textContent = `${d} of ${n} decided`;
  }

  function render() {
    renderList();
    if (finished) {
      $('view').innerHTML = `<div class="card empty"><h2>Review saved</h2>
        <p>${items().length - open().length} of ${items().length} items decided. You can close this tab.</p>
        <p>Go back to Claude Code and say <b>“apply the backfill review”</b>.</p></div>`;
      return;
    }
    if (!items().length) { $('view').innerHTML = '<div class="card empty"><h2>No clashes</h2><p>Nothing to review.</p></div>'; return; }
    const it = items()[cur], a = ans(it.id);
    const sides = (it.sides || []).map(s => `<div class="side"><div class="lbl">${esc(s.label)}</div>
      <p>${esc(s.says)}</p>${s.evidence ? `<span class="ev">${esc(s.evidence)}</span>` : ''}</div>`).join('');
    const opts = (it.options || []).map((o, k) => `<button class="opt ${a && a.choice === k ? 'sel' : ''}" data-k="${k}">
      <span class="key">${k + 1}</span><span>${esc(o)}</span>${k === it.recommendation ? '<span class="rec">Recommended</span>' : ''}</button>`).join('');
    $('view').innerHTML = `<div class="card">
      <div class="meta"><span>${esc(it.id)}</span><span class="badge">${esc(it.kind || 'clash')}</span></div>
      <h2>${esc(it.title)}</h2>
      <div class="sides">${sides}</div>
      <div class="opts" role="group" aria-label="Options">${opts}</div>
      ${it.recommendation_why ? `<div class="why"><b>Why the recommendation:</b> ${esc(it.recommendation_why)}</div>` : ''}
      ${it.affects ? `<div class="affects">Affects: ${esc(it.affects)}</div>` : ''}
      <div class="custom ${a && a.choice === 'custom' ? 'show' : ''}" id="customBox">
        <textarea id="customText" placeholder="Your answer (becomes the rule)">${esc(a && a.choice === 'custom' ? a.text : '')}</textarea>
        <div class="row"><button class="btn primary" id="saveCustom">Save answer</button></div>
      </div>
      <div class="row">
        <button class="btn" id="own">Own answer (E)</button>
        <button class="btn danger" id="reject">Reject finding (X)</button>
        ${a ? '<button class="btn" id="undo">Undo (U)</button>' : ''}
        <span class="state ${a ? 'saved' : ''}" id="state">${a ? '✓ ' + esc(label(a, it)) : 'Not decided'}</span>
      </div></div>`;
  }

  async function decide(choice, text = '') {
    const it = items()[cur];
    try {
      await api('/api/answer', {id: it.id, choice, text});
      data.answers[it.id] = {choice, text};
      next(true);
    } catch (e) { $('state').textContent = 'Could not save — is the review server still running?'; }
  }
  async function undo() {
    const it = items()[cur];
    await api('/api/answer', {id: it.id, clear: true});
    delete data.answers[it.id]; render();
  }
  function next(skipDecided) {
    const n = items().length;
    for (let s = 1; s <= n; s++) {
      const j = (cur + s) % n;
      if (!skipDecided || !ans(items()[j].id)) { cur = j; break; }
    }
    render();
  }
  function prev() { cur = (cur - 1 + items().length) % items().length; render(); }
  function own() { $('customBox').classList.add('show'); $('customText').focus(); }

  document.addEventListener('click', e => {
    const li = e.target.closest('nav button'); if (li) { cur = +li.dataset.i; render(); return; }
    const o = e.target.closest('.opt'); if (o) { decide(+o.dataset.k); return; }
    if (e.target.id === 'own') own();
    if (e.target.id === 'reject') decide('reject');
    if (e.target.id === 'undo') undo();
    if (e.target.id === 'saveCustom') { const t = $('customText').value.trim(); if (t) decide('custom', t); }
  });
  document.addEventListener('keydown', e => {
    if (finished || !data || !items().length) return;
    if (e.target.tagName === 'TEXTAREA') {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { const t = e.target.value.trim(); if (t) decide('custom', t); }
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const it = items()[cur], k = e.key.toLowerCase();
    if (/^[1-9]$/.test(k) && +k <= (it.options || []).length) decide(+k - 1);
    else if (k === 'r' && Number.isInteger(it.recommendation)) decide(it.recommendation);
    else if (k === 'e') { e.preventDefault(); own(); }
    else if (k === 'x') decide('reject');
    else if (k === 'u' && ans(it.id)) undo();
    else if (k === 's' || k === 'arrowright' || k === 'j') next(false);
    else if (k === 'arrowleft' || k === 'k') prev();
  });
  $('acceptAll').onclick = async () => {
    const batch = open().filter(i => Number.isInteger(i.recommendation)).map(i => ({id: i.id, choice: i.recommendation, text: ''}));
    if (!batch.length) return;
    await api('/api/answer', {answers: batch});
    batch.forEach(b => data.answers[b.id] = b); render();
  };
  $('done').onclick = async () => {
    const left = open().length;
    if (left && !confirm(`${left} item(s) are still open. They stay open for later. Finish now?`)) return;
    await api('/api/done', {}); finished = true; render();
  };

  api('/api/review').then(d => {
    data = d;
    $('repo').textContent = 'Backfill review — ' + (d.repo || '');
    $('sub').textContent = `${d.run_date || ''} · ${d.recorded_without_review ?? '?'} entries recorded without review`;
    const firstOpen = items().findIndex(i => !ans(i.id)); cur = firstOpen < 0 ? 0 : firstOpen;
    render();
  }).catch(() => { $('view').innerHTML = '<div class="card empty"><h2>Review server not reachable</h2></div>'; });
})();
</script>
</body>
</html>
